name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform exists
        run: flutter create . --platforms=android --no-pub

      - name: Fix Kotlin Version and Compile Conflict
        run: |
          python3 -c '
          import os, glob, re

          # Fix kotlin version in all build.gradle files
          for path in glob.glob("**/build.gradle*", recursive=True):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              
              content = re.sub(r"kotlin-gradle-plugin:[\d\.]+", "kotlin-gradle-plugin:1.8.22", content)
              content = re.sub(r"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[\d\.]+", "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22", content)
              
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          # Clean any misplaced kotlin files causing compileKotlin error in gradle dir
          for path in glob.glob("gradle/**/*.kt", recursive=True):
              try:
                  os.remove(path)
              except:
                  pass
          '

      - name: Clean and Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-fatal-warnings

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
