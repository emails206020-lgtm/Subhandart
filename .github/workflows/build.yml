name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Remove notification package entirely
        run: |
          python3 -c '
          import os

          # Clean pubspec.yaml
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  for line in lines:
                      if "flutter_local_notifications" not in line:
                          f.write(line)

          # Delete lock file
          if os.path.exists("pubspec.lock"):
              os.remove("pubspec.lock")
          '

      - name: Get dependencies fresh
        run: flutter pub get --no-example

      - name: Build APK
        run: flutter build apk --release --no-fatal-warnings

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
