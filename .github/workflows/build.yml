name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Update compileSdk to 34
        run: |
          python3 -c '
          import glob
          for path in glob.glob("android/app/build.gradle", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 34")
              content = content.replace("compileSdk flutter.compileSdkVersion", "compileSdk 34")
              if "compileSdk" not in content:
                  content = content.replace("android {", "android {\n    compileSdk 34")
              else:
                  content = content.replace("compileSdk 33", "compileSdk 34")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-fatal-warnings

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
