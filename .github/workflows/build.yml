name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean notification code from project
        run: |
          python3 -c '
          import glob
          for path in glob.glob("lib/**/*.dart", recursive=True):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
              new_lines = [l for l in lines if "flutter_local_notifications" not in l and "flutterLocalNotificationsPlugin" not in l]
              if len(new_lines) != len(lines):
                  with open(path, "w", encoding="utf-8") as f:
                      f.writelines(new_lines)
          '

      - name: Remove package from pubspec
        run: flutter pub remove flutter_local_notifications || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-fatal-warnings

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
