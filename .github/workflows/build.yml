name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure Android platform exists
        run: flutter create . --platforms=android --no-pub

      - name: Fix dependencies and compileSdk safely
        run: |
          python3 -c '
          import glob, re

          for path in glob.glob("pubspec.yaml", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              if "flutter_local_notifications:" in content:
                  content = re.sub(r"flutter_local_notifications:\s*\^?[\d\.]+", "flutter_local_notifications: ^17.2.4", content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

          for path in glob.glob("**/build.gradle*", recursive=True):
              if "android/app" in path:
                  with open(path, "r", encoding="utf-8") as f:
                      g_content = f.read()
                  g_content = re.sub(r"compileSdk\s+\d+", "compileSdk 34", g_content)
                  g_content = re.sub(r"compileSdkVersion\s+[\w\.]+", "compileSdkVersion 34", g_content)
                  if "compileSdk 34" not in g_content and "compileSdkVersion 34" not in g_content:
                      g_content = g_content.replace("android {", "android {\n    compileSdk 34")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(g_content)
          '

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-fatal-warnings

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
